overlay: 1.0.0
info:
  title: TypeScript SDK authentication
  version: 1.0.0
actions:
  - target: $.components.securitySchemes
    update:
      BearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
      EnvironmentId:
        type: apiKey
        in: header
        name: X-Environment-ID
  - target: $.paths.*.*[?(@.security)]
    update:
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
          EnvironmentId: []
        - BearerAuth: []
