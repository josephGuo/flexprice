  # 生成代码generate-ent:
  # 1. go run -mod=mod entgo.io/ent/cmd/ent generate --feature sql/execquery ./ent/schema
  # 构建迁移镜像
  # 2. docker compose -f docker-compose.locdev.yml build flexprice-migrate
  # 3. docker build . -f .\Dockerfile.local -t flexprice-app.loc
  # 一、self-host docker容器运行
  # docker compose -f docker-compose.locdev.yml -p flexpriceloc up -d
  # 二、本地调试运行
  # docker build . -f .\Dockerfile.local kafka clickhouse temporal temporal-ui
  # go run cmd/server/main.go

  # 前端镜像构建与运行
  # docker build ../flexprice-front -f ../flexprice-front/Dockerfile -t flexprice-front.loc 
  # docker run -p 80:3000 -e VITE_API_URL=http://localhost:8080/v1 -e VITE_AUTH_DOMAIN=http://localhost:8080/v1  flexprice-front.loc

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    networks:
      - infra-pgsql
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      CLUSTER_ID: ca497efe-9f82-4b84-890b-d9969a9a2e1c
      KAFKA_BROKER_ID: 0
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.9-alpine
    networks:
      - infra-pgsql
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9009:9009"
    environment:
      CLICKHOUSE_USER: flexprice
      CLICKHOUSE_PASSWORD: flexprice123
      CLICKHOUSE_DB: flexprice
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://clickhouse:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:main
    networks:
      - infra-pgsql
    profiles:
      - dev
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://kafka-ui:8080/"]
      interval: 10s
      timeout: 5s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29.2
    networks:
      - infra-pgsql
    ports:
      - "7233:7233"
    environment:
      - ENABLE_ES=false
      - DB=postgres12
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PWD=SA123root1.618
      - DB_NAME=temporal
      - DB_HOST=devPostgresql
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=SA123root1.618
      - POSTGRES_SEEDS=devPostgresql
      - TEMPORAL_PERSISTENCE_SCHEMA_DIR=/etc/temporal/schema/postgresql/v96/temporal/versioned
    depends_on:
      flexprice-db-init:
        condition: service_completed_successfully

  temporal-ui:
    image: temporalio/ui:2.44.0
    networks:
      - infra-pgsql
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal

  # Build stage as a separate service that other services can depend on
  flexprice-build:
    image: flexprice-app.loc
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        - GOPROXY=https://goproxy.cn,direct
    profiles:
      - build-only
    command: ["echo", "Build complete"]

  # Database initialization (Temporal DB, Extensions, Seed Data)
  flexprice-db-init:
    image: postgres:17-alpine
    networks:
      - infra-pgsql
    environment:
      - PGPASSWORD=SA123root1.618
    volumes:
      - ./migrations:/migrations
    depends_on:
      clickhouse:
        condition: service_healthy      
    command: >
      sh -c "
        echo 'Waiting for devPostgresql...' &&
        until pg_isready -h devPostgresql -U postgres; do sleep 2; done &&
        echo 'Creating temporal database...' &&
        psql -h devPostgresql -U postgres -d postgres -c 'CREATE DATABASE temporal;' || echo 'Database temporal already exists' &&
        echo 'Creating extensions schema and uuid-ossp extension...' &&
        psql -h devPostgresql -U postgres -d postgres -c 'CREATE SCHEMA IF NOT EXISTS extensions;' &&
        psql -h devPostgresql -U postgres -d postgres -c 'CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\" SCHEMA extensions;' &&
        echo 'Running seed data...' &&
        psql -h devPostgresql -U postgres -d postgres -f /migrations/postgres/V1__seed.sql &&
        
        echo 'Waiting for ClickHouse to be ready...' &&
        sleep 5 &&
        for file in /migrations/clickhouse/*.sql; do
          if [ -f \"$$file\" ]; then
            echo 'Running migration: '\"$$file\" &&
            clickhouse-client --host clickhouse --user flexprice --password flexprice123 --database flexprice --multiquery < \"$$file\";
          fi
        done &&
        echo 'ClickHouse migrations complete.'

        echo 'Database initialization complete.'
      "

  # Ent Schema Migration
  flexprice-migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    image: flexprice-migrate.loc
    networks:
      - infra-pgsql
    depends_on:
      flexprice-db-init:
        condition: service_completed_successfully
    environment:
      - FLEXPRICE_POSTGRES_HOST=devPostgresql
      - FLEXPRICE_POSTGRES_USER=postgres
      - FLEXPRICE_POSTGRES_PASSWORD=SA123root1.618
      - FLEXPRICE_POSTGRES_DBNAME=flexprice
    restart: on-failure

  flexprice-api:
    image: flexprice-app.loc
    networks:
      - infra-pgsql
    depends_on:
      flexprice-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      temporal:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - FLEXPRICE_DEPLOYMENT_MODE=api
      - FLEXPRICE_POSTGRES_HOST=devPostgresql
      - FLEXPRICE_POSTGRES_USER=postgres
      - FLEXPRICE_POSTGRES_PASSWORD=SA123root1.618
      - FLEXPRICE_POSTGRES_DBNAME=flexprice
      - FLEXPRICE_KAFKA_BROKERS=kafka:9092
      - FLEXPRICE_CLICKHOUSE_ADDRESS=clickhouse:9000
      - FLEXPRICE_TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./internal/config:/app/internal/config
    restart: unless-stopped

  flexprice-consumer:
    image: flexprice-app.loc
    networks:
      - infra-pgsql
    depends_on:
      flexprice-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      - FLEXPRICE_DEPLOYMENT_MODE=consumer
      - FLEXPRICE_POSTGRES_HOST=devPostgresql
      - FLEXPRICE_POSTGRES_USER=postgres
      - FLEXPRICE_POSTGRES_PASSWORD=SA123root1.618
      - FLEXPRICE_POSTGRES_DBNAME=flexprice
      - FLEXPRICE_KAFKA_BROKERS=kafka:9092
      - FLEXPRICE_CLICKHOUSE_ADDRESS=clickhouse:9000
      - FLEXPRICE_TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./internal/config:/app/internal/config
    restart: unless-stopped

  flexprice-worker:
    image: flexprice-app.loc
    networks:
      - infra-pgsql
    depends_on:
      flexprice-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      - FLEXPRICE_DEPLOYMENT_MODE=temporal_worker
      - FLEXPRICE_POSTGRES_HOST=devPostgresql
      - FLEXPRICE_POSTGRES_USER=postgres
      - FLEXPRICE_POSTGRES_PASSWORD=SA123root1.618
      - FLEXPRICE_POSTGRES_DBNAME=flexprice
      - FLEXPRICE_KAFKA_BROKERS=kafka:9092
      - FLEXPRICE_CLICKHOUSE_ADDRESS=clickhouse:9000
      - FLEXPRICE_TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./internal/config:/app/internal/config
    restart: unless-stopped

  flexprice-front:
    image: flexprice-front.loc
    container_name: flexprice-front
    build:
      context: ../flexprice-front
      dockerfile: ../flexprice-front/Dockerfile
    ports:
      - "80:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s  

networks:
  infra-pgsql:
    external: true

volumes:
  kafka-data:
  clickhouse-data: