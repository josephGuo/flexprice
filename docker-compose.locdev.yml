services:
  # docker build . -f .\Dockerfile.local -t flexprice-app.loc
  # docker compose -f docker-compose.locdev.yml up -d
  # 1. 移除原 postgres 服务块

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      CLUSTER_ID: ca497efe-9f82-4b84-890b-d9969a9a2e1c
      KAFKA_BROKER_ID: 0
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - infra-pgsql  # 加入外部PostgreSQL所在网络
      - default

  clickhouse:
    image: clickhouse/clickhouse-server:24.9-alpine
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9009:9009"
    environment:
      CLICKHOUSE_USER: flexprice
      CLICKHOUSE_PASSWORD: flexprice123
      CLICKHOUSE_DB: flexprice
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://clickhouse:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - infra-pgsql
      - default

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:main
    profiles:
      - dev
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://kafka-ui:8080/"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - infra-pgsql
      - default

  temporal:
    image: temporalio/auto-setup:1.29.2
    ports:
      - "7233:7233"
    environment:
      - ENABLE_ES=false
      - DB=postgres12
      - DB_PORT=5432
      #- DB_USER=postgres  # 替换为外部PostgreSQL的用户
      #- DB_PWD=SA123root1.618  # 替换为外部PostgreSQL的密码
      - DB_NAME=temporal  # Temporal专用库（需在外部PostgreSQL中提前创建）
      #- DB_HOST=devPostgresql  # 替换为外部容器名
      - POSTGRES_USER=postgres  # 替换为外部PostgreSQL的用户
      - POSTGRES_PWD=SA123root1.618  # 替换为外部PostgreSQL的密码
      - POSTGRES_SEEDS=devPostgresql  # 替换为外部容器名
      - TEMPORAL_PERSISTENCE_SCHEMA_DIR=/etc/temporal/schema/postgresql/v96/temporal/versioned
    # 移除对内置postgres的依赖，挂载wait-for-it脚本等待外部PostgreSQL
    volumes:
      - ./wait-for-it.sh:/usr/local/bin/wait-for-it.sh:ro
      - ./init-temporal-db.sh:/docker-entrypoint-initdb.d/init-temporal-db.sh
      - ./migrations/postgres:/docker-entrypoint-initdb.d/
    command: [
      "sh", "-c",
      "chmod +x /usr/local/bin/wait-for-it.sh && /usr/local/bin/wait-for-it.sh devPostgresql:5432 --timeout=300 -- /usr/bin/temporal-auto-setup"
    ]
    networks:
      - infra-pgsql
      - default

  temporal-ui:
    image: temporalio/ui:2.44.0
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - infra-pgsql
      - default

  flexprice-build:
    image: flexprice-app.loc
    build:
      context: .
      dockerfile: Dockerfile.local
    profiles:
      - build-only
    command: ["echo", "Build complete"]
    networks:
      - infra-pgsql
      - default

  flexprice-api:
    image: flexprice-app.loc
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      temporal:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - FLEXPRICE_DEPLOYMENT_MODE=api
      - FLEXPRICE_POSTGRES_HOST=devPostgresql  # 替换为外部容器名
      - FLEXPRICE_POSTGRES_USER=postgres  # 外部PostgreSQL用户
      - FLEXPRICE_POSTGRES_PASSWORD=SA123root1.618  # 外部PostgreSQL密码
      - FLEXPRICE_POSTGRES_DB=postgres  # 外部PostgreSQL数据库
      - FLEXPRICE_KAFKA_BROKERS=kafka:9092
      - FLEXPRICE_CLICKHOUSE_ADDRESS=clickhouse:9000
      - FLEXPRICE_TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./internal/config:/app/internal/config
      - ./wait-for-it.sh:/usr/local/bin/wait-for-it.sh:ro
    # 启动前等待外部PostgreSQL就绪
    command: [
      "sh", "-c",
      "chmod +x /usr/local/bin/wait-for-it.sh && /usr/local/bin/wait-for-it.sh devPostgresql:5432 --timeout=300 -- /app/entrypoint.sh"  # 替换为应用实际入口
    ]
    restart: unless-stopped
    networks:
      - infra-pgsql
      - default

  flexprice-consumer:
    image: flexprice-app.loc
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      - FLEXPRICE_DEPLOYMENT_MODE=consumer
      - FLEXPRICE_POSTGRES_HOST=devPostgresql  # 替换为外部容器名
      - FLEXPRICE_POSTGRES_USER=postgres  # 外部PostgreSQL用户
      - FLEXPRICE_POSTGRES_PASSWORD=SA123root1.618  # 外部PostgreSQL密码
      - FLEXPRICE_POSTGRES_DB=postgres  # 外部PostgreSQL数据库
      - FLEXPRICE_KAFKA_BROKERS=kafka:9092
      - FLEXPRICE_CLICKHOUSE_ADDRESS=clickhouse:9000
      - FLEXPRICE_TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./internal/config:/app/internal/config
      - ./wait-for-it.sh:/usr/local/bin/wait-for-it.sh:ro
    command: [
      "sh", "-c",
      "chmod +x /usr/local/bin/wait-for-it.sh && /usr/local/bin/wait-for-it.sh devPostgresql:5432 --timeout=300 -- /app/entrypoint.sh"  # 替换为应用实际入口
    ]
    restart: unless-stopped
    networks:
      - infra-pgsql
      - default

  flexprice-worker:
    image: flexprice-app.loc
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      - FLEXPRICE_DEPLOYMENT_MODE=temporal_worker
      - FLEXPRICE_POSTGRES_HOST=devPostgresql  # 替换为外部容器名
      - FLEXPRICE_POSTGRES_USER=postgres  # 外部PostgreSQL用户
      - FLEXPRICE_POSTGRES_PASSWORD=SA123root1.618  # 外部PostgreSQL密码
      - FLEXPRICE_POSTGRES_DB=postgres  # 外部PostgreSQL数据库
      - FLEXPRICE_KAFKA_BROKERS=kafka:9092
      - FLEXPRICE_CLICKHOUSE_ADDRESS=clickhouse:9000
      - FLEXPRICE_TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./internal/config:/app/internal/config
      - ./wait-for-it.sh:/usr/local/bin/wait-for-it.sh:ro
    command: [
      "sh", "-c",
      "chmod +x /usr/local/bin/wait-for-it.sh && /usr/local/bin/wait-for-it.sh devPostgresql:5432 --timeout=300 -- /app/entrypoint.sh"  # 替换为应用实际入口
    ]
    restart: unless-stopped
    networks:
      - infra-pgsql
      - default

# 2. 移除无用的 postgres-data 卷
volumes:
  kafka-data:
  clickhouse-data:

# 3. 声明外部网络（需提前创建：docker network create infra-pgsql）
networks:
  infra-pgsql:
    external: true  # 表示该网络已存在（外部PostgreSQL容器已加入）
  default:
    driver: bridge